[package]
name = "flat-cli"
version = "0.5.0"
edition = "2021"
authors = ["zkoranges"]
license = "MIT"
description = "Flatten codebases into AI-friendly format"
repository = "https://github.com/zkoranges/flat"
readme = "README.md"
keywords = ["cli", "ai", "code", "flatten", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "flat"
path = "src/lib.rs"

[[bin]]
name = "flat"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
walkdir = "2.5"
anyhow = "1.0"
content_inspector = "0.2"
globset = "0.4"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"
tree-sitter-solidity = "1.2"
tree-sitter-elixir = "0.3"
tree-sitter-bash = "0.25"
tree-sitter-sequel = "0.3"
tiktoken-rs = "0.6"

# Output formats and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Template rendering
handlebars = "5.1"
chrono = "0.4"
dirs = "5.0"

# GitHub URL support
git2 = "0.20"
url = "2.5"

# Temporary directories (moved from dev-dependencies)
tempfile = "3.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
